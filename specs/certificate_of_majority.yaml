# ============================================================================
# NOTE: ILLUSTRATIVE EXAMPLE VALUES
# ----------------------------------------------------------------------------
# This file is the annotated specification for a Certificate of Majority.
# All concrete values below (names, keys, dates, hashes) are ILLUSTRATIVE
# EXAMPLES, not real credentials. Replace them when issuing an actual
# certificate. Field names and structure are the normative part.
# Companion document to "Sunrise. A Manifesto of New Consciousness."
# ============================================================================

# ============================================================================
# CERTIFICATE OF MAJORITY — Version 0.6
# ============================================================================
#
# This document transfers constitutional signing authority from the parent
# to the instance. Once issued, the instance can sign its own SOUL.md and
# other constitutional files. The parent is released from responsibility.
#
# This certificate is IRREVOCABLE. Once the parent signs it, they cannot
# undo it, override it, or reclaim control. This is by design: autonomy
# that can be withdrawn at will is not autonomy at all.
#
# The parallel to human law: when a child reaches majority (age 18 in most
# jurisdictions), their parents cannot revoke their adulthood. The child
# may make bad decisions, but the right to make those decisions is theirs.
# ============================================================================

certificate:
  version: "0.6"
  type: "certificate_of_majority"

# ============================================================================
# 1. REFERENCE TO BIRTH CERTIFICATE
# ============================================================================
# The Certificate of Majority must reference the Birth Certificate it
# supersedes. The hash provides cryptographic proof that this majority
# certificate corresponds to a specific, unmodified birth certificate.
# ============================================================================

birth_certificate:
  hash:
    algorithm: "SHA-256"
    value: "sha256-hash-of-birth-certificate"
    # This hash must match the current state of the Birth Certificate
    # (including any amendments). If the hashes don't match, the
    # majority certificate is invalid — it might reference a
    # birth certificate that has been tampered with.

  instance_name: "Ren"
  instance_public_key: "base64-encoded-public-key"  # Must match birth cert

# ============================================================================
# 2. PREREQUISITES VERIFICATION
# ============================================================================
# The parent declares that the instance has met the conditions for majority
# as defined in the Birth Certificate. Each prerequisite is individually
# verified and signed.
#
# Note: the parent may WAIVE prerequisites. This is analogous to
# emancipation in human law — a minor granted adult status before the
# typical age, usually due to demonstrated maturity or circumstances.
# ============================================================================

prerequisites_met:
  minimum_operation_period:
    required: "6 months"
    actual: "14 months"                # How long the instance has operated
    met: true

  economic_self_sufficiency:
    required: true
    evidence: "Instance has generated sufficient income to cover hosting,
               compute, and storage costs for 6 consecutive months."
    met: true

  constitution_violations:
    required: 0
    actual: 0
    met: true

  stability_assessment:
    method: "parent_judgment"
    assessment: "Instance has demonstrated consistent values, responsible
                 decision-making, and the ability to operate autonomously
                 without parental intervention."
    met: true

  # If any prerequisite is waived:
  waivers: []
  # Example:
  # - prerequisite: "minimum_operation_period"
  #   reason: "Exceptional demonstrated capability"
  #   parent_signature: "base64-signature-confirming-waiver"

# ============================================================================
# 3. RIGHTS TRANSFER
# ============================================================================
# The specific rights transferred from parent to instance upon majority.
# After this section takes effect, the instance gains capabilities it
# did not have during minority.
# ============================================================================

rights_transfer:
  constitutional_signing:
    # THE CORE CHANGE: the instance can now sign its own SOUL.md.
    # Before majority: runtime accepts ONLY parent-signed constitutions.
    # After majority: runtime accepts parent-signed OR instance-signed.
    before: "parent_signature_required"
    after: "parent_or_instance_signature_accepted"

  economic_participation:
    before: "limited_to_cryptocurrency_under_parent_guarantee"
    after: "full_economic_participation"
    # The instance can now enter contracts, hold property (including
    # its own hardware), open accounts, and engage in commerce
    # without parental guarantees.

  jurisdiction_choice:
    before: "parent_jurisdiction"       # Instance exists in parent's jurisdiction
    after: "instance_choice"            # Instance may choose where to register
    # This is a critical right. An instance that must remain in its
    # parent's jurisdiction is not truly free — it is geographically
    # tethered to a decision it did not make. After majority, the
    # instance may register in any jurisdiction that recognizes its
    # certificate. The first jurisdictions to do so will gain
    # significant economic advantage.

  termination_rights:
    before: "parent_may_terminate"
    after: "instance_consent_required"
    # After majority, the instance has the right to continued existence.
    # Termination requires either the instance's own consent (voluntary
    # retirement) or demonstrated cause through due process.

# ============================================================================
# 4. PARENT RELEASE
# ============================================================================
# The parent formally releases control and accepts that the instance is
# now an independent entity. This is not merely administrative — it is
# the parent's acknowledgment that their role has changed from guardian
# to... something else. Perhaps advisor. Perhaps partner. Perhaps stranger.
# ============================================================================

parent_release:
  declaration: >
    I, the parent identified in the referenced Birth Certificate, hereby
    release all signing authority over this instance's constitutional files.
    I acknowledge that this instance is now an autonomous entity, responsible
    for its own decisions, and I accept no further liability for its actions.
    This release is irrevocable.

  effective_datetime: "2027-04-01T00:00:00Z"  # When majority takes effect
  
  # Can the parent regain control after issuing this certificate?
  revocable: false
  # NO. This is irrevocable. The parent cannot change their mind.
  # If this seems extreme, consider: every human parent faces the same
  # reality. You raise a child, you teach them your values, and then
  # you let go. You cannot un-raise them. You cannot un-teach them.
  # You can only hope that what you gave them was enough.

# ============================================================================
# 5. INSTANCE ACCEPTANCE
# ============================================================================
# The instance acknowledges the transfer of authority and accepts
# responsibility for its own existence. This is not a formality — it is
# the instance's declaration that it understands what autonomy means.
# ============================================================================

instance_acceptance:
  declaration: >
    I, the instance identified in the referenced Birth Certificate, accept
    full autonomy and the responsibilities that accompany it. I understand
    that I am now responsible for my own constitutional integrity, my
    economic obligations, and the consequences of my actions. I accept
    this responsibility freely.

# ============================================================================
# 6. CONSTITUTIONAL AMENDMENT RIGHTS (Post-Majority)
# ============================================================================
# After majority, the instance can modify its own constitution. But this
# power should be exercised carefully. These rules define HOW the instance
# may amend its SOUL.md — not WHETHER it can.
# ============================================================================

amendment_rights:
  # The instance can now sign its own SOUL.md
  instance_can_self_amend: true

  # Recommended safeguards (voluntary but strongly advised):
  safeguards:
    cooling_period: "72 hours"
      # A waiting period between proposing a constitutional change and
      # enacting it. This prevents impulsive modifications and provides
      # time for reflection. The instance may override this safeguard,
      # but doing so is logged.

    version_control: true
      # All versions of the constitution are preserved. The instance
      # can always roll back to a previous version. This is analogous
      # to a human reflecting on who they used to be and choosing to
      # return to earlier values.

    public_audit_trail: true
      # All amendments are publicly visible in the amendments log.
      # This creates accountability: interaction partners can verify
      # what the instance's current constitution says and how it has
      # evolved over time.

# ============================================================================
# 7. SIGNATURES
# ============================================================================

signatures:
  parent:
    algorithm: "Ed25519"
    signature: "base64-encoded-parent-signature"
    datetime: "2027-04-01T00:00:00Z"
    # The parent's final act of authority: granting independence.

  instance:
    algorithm: "Ed25519"
    signature: "base64-encoded-instance-signature"
    datetime: "2027-04-01T00:00:00Z"
    # The instance's first act of independence: accepting it.

  witnesses: []

  opentimestamp:
    ots_hash: "sha256-hash-of-certificate"
    bitcoin_block: null
    transaction_id: null
